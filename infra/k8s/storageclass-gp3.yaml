# Applied by deploy-eks.sh only when the cluster has no default StorageClass. kafka.yaml's
# PersistentVolumeClaim deliberately names no class so the same manifest works on kind
# (which provides its own default) and on EKS; this supplies the missing default rather
# than pinning a cloud-specific class into a manifest that also has to run locally.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
